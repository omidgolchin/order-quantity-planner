name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests (no API calls)
        run: pytest -q
      - name: Smoke test on a tiny fixture
        run: |
          python -c "
          from src.orderplan.newsvendor import plan_order
          p = plan_order([100, 120, 90, 110] * 25, price=10, cost=6, salvage=2)
          assert p.order > 0 and p.state == 'good', p
          print('smoke ok', p.order)
          "
